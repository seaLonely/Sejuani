[package]
name = "sejuani-app"
version = "0.1.0"
description = "Sejuani 桌面前端"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
